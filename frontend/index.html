<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Group projects, out of the group chat. Shared boards where every task has a name and a date, and everyone sees changes live."
    />
    <meta name="theme-color" content="#EEE9DF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <!-- Link preview when the URL is shared (WhatsApp, Facebook, LinkedIn, X, Slack…).
         The server replaces __APP_URL__ with the live address. -->
    <link rel="canonical" href="__APP_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crewboard" />
    <meta property="og:url" content="__APP_URL__/" />
    <meta property="og:title" content="Crewboard: who’s doing the slides?" />
    <meta
      property="og:description"
      content="Group projects, out of the group chat. Every task gets a card with a name and a date, and your team sees changes live."
    />
    <meta property="og:image" content="__APP_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crewboard: a board with cards for a group project" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crewboard: who’s doing the slides?" />
    <meta name="twitter:description" content="Group projects, out of the group chat. Every task gets a card with a name and a date." />
    <meta name="twitter:image" content="__APP_URL__/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap"
    />
    <title>Crewboard</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('crewboard-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
