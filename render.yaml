# Render Blueprint: one free web service that serves the React app, the API and Socket.IO.
# The database is PostgreSQL on Neon; paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: crewboard
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # you paste the Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render creates a long random secret
      - key: GOOGLE_CLIENT_ID
        sync: false # your OAuth Client ID (…apps.googleusercontent.com)
      - key: ADMIN_EMAILS
        sync: false # who gets the admin panel, e.g. you@gmail.com (comma-separated; the email must be confirmed)
      # Password-reset emails. Without SMTP_HOST, reset links are written to the Render log instead.
      - key: APP_URL
        sync: false # e.g. https://crewboard-zgwk.onrender.com
      - key: SMTP_HOST
        sync: false # e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false # e.g. yourname@gmail.com
      - key: SMTP_PASS
        sync: false # Gmail: a 16-character app password, not your normal password
      - key: MAIL_FROM
        sync: false # e.g. Crewboard <yourname@gmail.com>
